---
# Matomo is not usable when the role finishes: the container serves a
# multi-step installation wizard which has to be walked through before there is
# a database schema, a user, or a site to track anything against. Until that
# happens Matomo answers 200 with the wizard's HTML to every request - the
# front page, the tracking endpoint and every Reporting API method alike - so a
# scenario that stopped at `converge` would be testing the wizard, not Matomo.
#
# Walking the wizard is a side effect and not part of `converge`: the role's own
# tasks are what `converge` is there to exercise, and driving an application's
# setup from it would blur the line between what the role does and what this
# scenario does on top.
#
# The wizard is a plain sequence of form posts sharing one PHP session. Each
# step answers 302 to the next one when it accepted the form and re-renders
# itself with 200 and an error when it did not, so `status_code: [302]` with
# redirects left unfollowed is what makes a rejected form fail here rather than
# quietly leave Matomo half-installed for `verify.yml` to puzzle over.
- name: Complete the Matomo installation wizard
  hosts: all
  become: true
  gather_facts: false

  vars:
    matomo_wizard_url: "{{ matomo_molecule_base_url }}/index.php"

  tasks:
    # The address Matomo has to reach the database at is a role default
    # (`matomo_database_host`, a Unix socket path here) and role defaults are
    # not in scope in this play. Reading it back out of the running container is
    # both shorter than restating it and a stronger statement: the wizard is
    # pointed at whatever the role actually configured, so a role that gets this
    # wrong fails here instead of being papered over by a correct copy.
    - name: Read the database address the role configured Matomo with
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - "{{ matomo_identifier }}"
          - printenv
          - MATOMO_DATABASE_HOST
      register: matomo_configured_database_host
      changed_when: false
      # The container is started by systemd and `docker exec` fails while it is
      # still coming up, which on a first boot includes unpacking Matomo into
      # the bind-mounted data directory.
      retries: 60
      delay: 5
      until: matomo_configured_database_host is not failed

    # systemd reports the unit active as soon as `docker start` has not exited,
    # which is well before Apache and PHP are answering. This first request is
    # also what opens the session the rest of the wizard runs in: Matomo hands
    # out `MATOMO_SESSID` here and never re-issues it, so every later step
    # replays this one cookie.
    - name: Wait for Matomo to serve its installation wizard (up to 10m)
      ansible.builtin.uri:
        url: "{{ matomo_wizard_url }}?action=databaseSetup&module=Installation"
        method: GET
        status_code: [200]
        follow_redirects: none
      register: matomo_wizard_session
      until: matomo_wizard_session.status == 200 and (matomo_wizard_session.cookies_string | default('')) != ''
      retries: 120
      delay: 5

    - name: Point the Matomo installer at the database this scenario wired up
      ansible.builtin.uri:
        url: "{{ matomo_wizard_url }}?action=databaseSetup&module=Installation"
        method: POST
        body_format: form-urlencoded
        body:
          host: "{{ matomo_configured_database_host.stdout | trim }}"
          username: "{{ matomo_database_username }}"
          password: "{{ matomo_database_password }}"
          dbname: "{{ matomo_database_name }}"
          tables_prefix: "{{ matomo_database_tables_prefix }}"
          adapter: 'PDO\MYSQL'
          submit: Next
        headers:
          Cookie: "{{ matomo_wizard_session.cookies_string }}"
        status_code: [302]
        follow_redirects: none
      register: matomo_wizard_database

    - name: Assert the Matomo installer accepted the database this scenario wired up
      ansible.builtin.assert:
        that: "'action=tablesCreation' in (matomo_wizard_database.location | default(''))"
        fail_msg: >-
          The Matomo installer did not move on to creating tables
          (it went to {{ matomo_wizard_database.location | default('nowhere') }}) -
          it could not connect to {{ matomo_configured_database_host.stdout | trim }}
        success_msg: "The Matomo installer connected to {{ matomo_configured_database_host.stdout | trim }}"

    # This is the step that actually creates the schema, so it is a slow one.
    - name: Let Matomo create its database schema
      ansible.builtin.uri:
        url: "{{ matomo_wizard_url }}?action=tablesCreation&module=Installation"
        method: GET
        status_code: [200]
        follow_redirects: none
        timeout: 300
        headers:
          Cookie: "{{ matomo_wizard_session.cookies_string }}"

    - name: Create the Matomo superuser
      ansible.builtin.uri:
        url: "{{ matomo_wizard_url }}?action=setupSuperUser&module=Installation"
        method: POST
        body_format: form-urlencoded
        body:
          login: "{{ matomo_molecule_superuser_login }}"
          password: "{{ matomo_molecule_superuser_password }}"
          password_bis: "{{ matomo_molecule_superuser_password }}"
          email: "{{ matomo_molecule_superuser_email }}"
          submit: Next
        headers:
          Cookie: "{{ matomo_wizard_session.cookies_string }}"
        status_code: [302]
        follow_redirects: none
      register: matomo_wizard_superuser

    - name: Assert Matomo accepted the superuser
      ansible.builtin.assert:
        that: "'action=firstWebsiteSetup' in (matomo_wizard_superuser.location | default(''))"
        fail_msg: >-
          The Matomo installer did not move on to setting up the first website
          (it went to {{ matomo_wizard_superuser.location | default('nowhere') }}) -
          the superuser was rejected
        success_msg: "Matomo created the superuser {{ matomo_molecule_superuser_login }}"

    - name: Create the Matomo site to track against
      ansible.builtin.uri:
        url: "{{ matomo_wizard_url }}?action=firstWebsiteSetup&module=Installation"
        method: POST
        body_format: form-urlencoded
        body:
          siteName: "{{ matomo_molecule_site_name }}"
          url: "{{ matomo_molecule_site_url }}"
          timezone: "{{ matomo_molecule_site_timezone }}"
          ecommerce: "0"
          submit: Next
        headers:
          Cookie: "{{ matomo_wizard_session.cookies_string }}"
        status_code: [302]
        follow_redirects: none
      register: matomo_wizard_website

    # Matomo names the site it just created in the redirect it sends, which is
    # where `idSite=1` - the site `verify.yml` tracks against - comes from.
    - name: Assert Matomo created the site as the first one
      ansible.builtin.assert:
        that: "'site_idSite=1' in (matomo_wizard_website.location | default(''))"
        fail_msg: >-
          Matomo did not report creating site 1
          (it went to {{ matomo_wizard_website.location | default('nowhere') }})
        success_msg: "Matomo created '{{ matomo_molecule_site_name }}' as site 1"

    # The last step writes the remaining configuration out and takes Matomo out
    # of installation mode, which is what stops the wizard from shadowing every
    # other URL.
    - name: Finish the Matomo installation
      ansible.builtin.uri:
        url: "{{ matomo_wizard_url }}?action=finished&module=Installation"
        method: POST
        body_format: form-urlencoded
        body:
          anonymise_ip: "1"
          submit: Continue
        headers:
          Cookie: "{{ matomo_wizard_session.cookies_string }}"
        status_code: [302]
        follow_redirects: none
      register: matomo_wizard_finished

    - name: Show the Matomo installation summary
      ansible.builtin.debug:
        msg:
          - "Database: {{ matomo_configured_database_host.stdout | trim }} ({{ matomo_database_name }})"
          - "Superuser: {{ matomo_molecule_superuser_login }}"
          - "Site: {{ matomo_molecule_site_name }} (idSite=1)"
          - "Installer left off at: {{ matomo_wizard_finished.location | default('nowhere') }}"
